name: Build

# bubble-translate: هر پوش یک APK دیباگ می‌سازد (Artifact).
# release-bubble: علاوه بر آن، یک pre-release منتشر می‌کند (امضای debug، بدون نیاز به secret).
on:
  push:
    branches: [bubble-translate, release-bubble]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish pre-release
        if: github.ref_name == 'release-bubble'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n1)
          TAG="bubble-v${VER}-r${GITHUB_RUN_NUMBER}"
          NAME="ScreenBubble-${VER}-r${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          gh release create "$TAG" "$NAME" "$NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$TAG" \
            --notes "Screen translator bubble (Persian <-> English) with ChatGPT / Gemini / Claude. Debug-signed build."
