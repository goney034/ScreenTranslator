name: Release (debug-signed)

# 发布不依赖私有签名密钥的预发布版：把代码推到 `release-debug` 分支即可，
# tag 与 pre-release 由本 workflow 自动创建。
# 使用 debug 签名，可直接安装；正式签名版仍走 release.yml（需要 keystore secrets）。
on:
  push:
    branches:
      - release-debug

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build debug APK and publish a pre-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Stub local.properties
        run: |
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n1)
          TAG="test-v${VER}-r${GITHUB_RUN_NUMBER}"
          NAME="ScreenTranslator-${VER}-r${GITHUB_RUN_NUMBER}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          gh release create "$TAG" "$NAME" "$NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$TAG" \
            --notes "Adds a 'Detect API & list models' panel: auto-detects OpenAI/Anthropic-style APIs, lists all models and tests any model (or any typed name) with a real 1-token request. Debug-signed build."
